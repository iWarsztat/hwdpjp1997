<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dodaj — Planer nauki</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">📚 Planer nauki</a>
      <nav aria-label="Główna nawigacja">
      <ul class="nav">
        <li><a href="index.html">🏠 Dzisiaj</a></li>
        <li><a href="tydzien.html">📅 Tydzień</a></li>
        <li><a href="dodaj.html" class="active" aria-current="page">➕ Dodaj</a></li>
        <li><a href="zadania.html">📝 Zadania</a></li>
        <li><a href="sprawdziany.html">📚 Sprawdziany</a></li>
        <li><a href="rutyna.html">⏰ Rutyna</a></li>
      </ul>
      </nav>
    </div>
  </header>
  <main class="container">
    <h1 class="page-title">Dodaj</h1>
    <p class="muted lead">Zapisz nowe zadanie lub sprawdzian. Dane zostają w tej przeglądarce.</p>
    <div class="grid-2">
      <section class="card">
        <h2>Dodaj zadanie</h2>
        <form id="taskForm" class="form">
          <label>Nazwa zadania<input type="text" id="taskTitle" required maxlength="120" placeholder="np. Ćwiczenia z matematyki"></label>
          <label>Przedmiot<select id="taskSubject" required></select></label>
          <label>Termin<input type="date" id="taskDue" required></label>
          <label>Notatka<textarea id="taskNote" rows="3" maxlength="300" placeholder="np. Strony 34–36"></textarea></label>
          <button type="submit" class="btn btn-primary">+ Dodaj zadanie</button>
          <p class="form-msg" id="taskMsg" role="status"></p>
        </form>
      </section>
      <section class="card">
        <h2>Dodaj sprawdzian</h2>
        <form id="examForm" class="form">
          <label>Nazwa / zakres<input type="text" id="examTitle" required maxlength="120" placeholder="np. Funkcje"></label>
          <label>Przedmiot<select id="examSubject" required></select></label>
          <label>Data<input type="date" id="examDate" required></label>
          <label>Trudność
            <select id="examDifficulty">
              <option value="1">Łatwy</option>
              <option value="2" selected>Średni</option>
              <option value="3">Trudny</option>
            </select>
          </label>
          <label>Zakres materiału<textarea id="examScope" rows="3" maxlength="300" placeholder="np. Rozdziały 1–3"></textarea></label>
          <button type="submit" class="btn btn-primary">+ Dodaj sprawdzian</button>
          <p class="form-msg" id="examMsg" role="status"></p>
        </form>
      </section>
    </div>
    <section class="card" id="planCard" hidden>
      <h2>Propozycja przygotowania</h2>
      <div id="planBox"></div>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/add.js"></script>
</body>
</html>
