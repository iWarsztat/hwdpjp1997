<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zadania — Planer nauki</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">📚 Planer nauki</a>
      <nav aria-label="Główna nawigacja">
      <ul class="nav">
        <li><a href="index.html">🏠 Dzisiaj</a></li>
        <li><a href="tydzien.html">📅 Tydzień</a></li>
        <li><a href="dodaj.html">➕ Dodaj</a></li>
        <li><a href="zadania.html" class="active" aria-current="page">📝 Zadania</a></li>
        <li><a href="sprawdziany.html">📚 Sprawdziany</a></li>
        <li><a href="rutyna.html">⏰ Rutyna</a></li>
      </ul>
      </nav>
    </div>
  </header>
  <main class="container">
    <h1 class="page-title">Zadania</h1>
    <section class="stats stats-3">
      <div class="card stat"><span class="stat-label">Wszystkie</span><strong id="cAll" class="stat-value">0</strong></div>
      <div class="card stat"><span class="stat-label">Do zrobienia</span><strong id="cTodo" class="stat-value">0</strong></div>
      <div class="card stat"><span class="stat-label">Ukończone</span><strong id="cDone" class="stat-value ok">0</strong></div>
    </section>
    <section class="toolbar card">
      <div class="seg" id="seg">
        <button type="button" class="seg-btn on" data-f="all">Wszystkie</button>
        <button type="button" class="seg-btn" data-f="todo">Do zrobienia</button>
        <button type="button" class="seg-btn" data-f="done">Ukończone</button>
      </div>
      <select id="subjFilter" aria-label="Filtr przedmiotu"></select>
      <a class="btn btn-primary btn-sm" href="dodaj.html">+ Dodaj</a>
    </section>
    <section class="card"><ul id="taskList" class="tasks"></ul></section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
